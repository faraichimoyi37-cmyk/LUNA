# fly.toml generated for LUNA investment platform
app = "luna-platform"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/data/luna.db"
  CORS_ORIGIN = "https://luna-platform.fly.dev"
  APP_URL = "https://luna-platform.fly.dev"

[mounts]
  source = "luna_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      path = "/health"
      interval = "15s"
      timeout = "5s"
      grace_period = "30s"

[experimental]
  auto_rollback = true

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
